# P4MiniShell CI: firmware + unit-test builds across board profiles.
#
# Uses the ESP-IDF v5.5.5 container. Every matrix leg must build with zero
# errors and zero warnings. Add a board by adding its profile under boards/
# (see PORTING.md): the matrix below discovers it automatically, so no
# workflow edit is needed. Hardware suites
# (tools/p4test_run.py, tools/regression.py, tools/capture_docs.py) stay
# local (see readme.md).
name: build

on:
  push:
  pull_request:

jobs:
  boards:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        name: Discover board profiles
        run: |
          python3 - <<'EOF' >>"$GITHUB_OUTPUT"
          import glob
          import json
          import os
          found = sorted(
              os.path.basename(os.path.normpath(p))
              for p in glob.glob(os.path.join("boards", "*/"))
              if os.path.isfile(os.path.join(p, "board_config.h"))
          )
          assert found, "no board profiles under boards/"
          print("matrix=" + json.dumps(found))
          EOF

  firmware:
    needs: boards
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.boards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware (${{ matrix.board }})
        run: |
          . $IDF_PATH/export.sh
          idf.py -DP4_BOARD=${{ matrix.board }} build
      - name: Build unit-test project (${{ matrix.board }})
        run: |
          . $IDF_PATH/export.sh
          cd test
          idf.py -DP4_BOARD=${{ matrix.board }} build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check (host tools)
        run: python3 -m compileall -q tools apps
      - name: Board profiles complete
        run: |
          python3 - <<'EOF'
          import glob
          import os
          import sys
          required = ("board_config.h", "board_config.yaml",
                      "sdkconfig.defaults", os.path.join("board_bsp", "extra_dirs.cmake"))
          missing = [
              os.path.join(profile, name)
              for profile in sorted(glob.glob(os.path.join("boards", "*/")))
              for name in required
              if not os.path.isfile(os.path.join(profile, name))
          ]
          if missing:
              print("incomplete board profiles:")
              print("\n".join("  " + path for path in missing))
              sys.exit(1)
          print("board profiles complete")
          EOF
