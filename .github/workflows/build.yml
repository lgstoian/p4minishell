# P4MiniShell CI: firmware + unit-test builds across board profiles.
#
# Uses the ESP-IDF v5.5.5 container. Every matrix leg must build with zero
# errors and zero warnings. Add a board by adding its profile under boards/
# (see PORTING.md) and its name to the matrix below. Hardware suites
# (tools/p4test_run.py, tools/regression.py, tools/capture_docs.py) stay
# local (see readme.md).
name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        board: [jc1060p470c, m5stack_tab5]
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware (${{ matrix.board }})
        run: |
          . $IDF_PATH/export.sh
          idf.py -DP4_BOARD=${{ matrix.board }} build
      - name: Build unit-test project (${{ matrix.board }})
        run: |
          . $IDF_PATH/export.sh
          cd test
          idf.py -DP4_BOARD=${{ matrix.board }} build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check (host tools)
        run: python3 -m compileall -q tools apps
      - name: Board profiles present
        run: |
          test -f boards/jc1060p470c/board_config.h
          test -f boards/m5stack_tab5/board_config.h
