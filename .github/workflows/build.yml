# P4MiniShell CI: firmware + unit-test builds across board profiles.
#
# Uses the ESP-IDF v5.5.5 container. Every matrix leg must build with zero
# errors and zero warnings. Add a board by adding its profile under boards/
# (see PORTING.md): the matrix below discovers it automatically, so no
# workflow edit is needed. The `host-unit` job runs the hardware-free Unity
# subset plus the v1.6 host surface/app gates (harness.md §2.2); a host pass is
# never hardware sign-off. Hardware suites
# (tools/p4test_run.py, tools/regression.py, tools/capture_docs.py) stay
# local (see readme.md).
name: build

on:
  push:
  pull_request:

jobs:
  boards:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        name: Discover board profiles
        run: |
          python3 - <<'EOF' >>"$GITHUB_OUTPUT"
          import glob
          import json
          import os
          found = sorted(
              os.path.basename(os.path.normpath(p))
              for p in glob.glob(os.path.join("boards", "*/"))
              if os.path.isfile(os.path.join(p, "board_config.h"))
          )
          assert found, "no board profiles under boards/"
          print("matrix=" + json.dumps(found))
          EOF

  firmware:
    needs: boards
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.boards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware (${{ matrix.board }})
        run: |
          . $IDF_PATH/export.sh
          idf.py -DP4_BOARD=${{ matrix.board }} build
      - name: Build unit-test project (${{ matrix.board }})
        run: |
          . $IDF_PATH/export.sh
          cd test
          idf.py -DP4_BOARD=${{ matrix.board }} build

  # Hardware-free pre-gate: the pure-logic Unity cases on ESP-IDF's "linux"
  # target. It compiles the same test/main sources as the on-target app and
  # runs them natively, so a logic regression is caught on every PR without a
  # board. This is NOT hardware sign-off: harness.md §0 still governs, and the
  # suites below remain the release gate.
  host-unit:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Static gates for the host lane
        run: |
          . $IDF_PATH/export.sh
          python3 tools/host_gen_runner.py --check
          python3 tools/host_unit_run.py --static
      - name: Build host unit suite (native POSIX ELF)
        run: |
          . $IDF_PATH/export.sh
          # The "linux" target needs the libbsd compatibility headers
          # (components/linux/include/sys/cdefs.h includes <bsd/sys/cdefs.h>).
          apt-get update -qq && apt-get install -y -qq libbsd-dev
          python3 tools/host_unit_run.py --build
      - name: Run host ELF (POSIX, no board)
        run: |
          . $IDF_PATH/export.sh
          python3 tools/host_unit_run.py --no-build
      - name: Host batch and webapp pre-gates (no board)
        run: |
          . $IDF_PATH/export.sh
          # The build above produces test/host/build/*.elf; point both gates
          # at it explicitly (the batch gate auto-discovers only build-* dirs).
          python3 tools/host_batch_run.py --elf test/host/build/host_batch_run.elf --check
          python3 tools/host_webapp_gate.py --renderer test/host/build/host_webapp_render.elf --check
      - name: Host surface and app pre-gates (no board, v1.6)
        run: |
          . $IDF_PATH/export.sh
          # These compile/drive the shipped cores with a plain C compiler or
          # the same real interpreter ELF. They open no serial port and are
          # never hardware sign-off (harness.md 0 / 2.2).
          python3 tools/host_tui_gate.py --check
          python3 tools/host_modal_gate.py --check
          python3 tools/gfx_toolkit_test.py --host
          python3 tools/host_apps_gate.py --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: False-green and artifact identity gates
        run: |
          python3 -m pip install -q Pillow
          python3 tools/green_guard.py --strict
          python3 tools/comment_index.py
          python3 tools/breadcrumbs.py
          python3 tools/gallery_audit.py
          python3 tools/gallery_audit_selftest.py
          python3 tools/led_contract.py
          python3 tools/harness/verify.py
      - name: Python syntax check (host tools)
        run: python3 -m compileall -q tools apps
      - name: Board profiles complete
        run: |
          python3 - <<'EOF'
          import glob
          import os
          import sys
          required = ("board_config.h", "board_config.yaml",
                      "sdkconfig.defaults", os.path.join("board_bsp", "extra_dirs.cmake"))
          missing = [
              os.path.join(profile, name)
              for profile in sorted(glob.glob(os.path.join("boards", "*/")))
              for name in required
              if not os.path.isfile(os.path.join(profile, name))
          ]
          if missing:
              print("incomplete board profiles:")
              print("\n".join("  " + path for path in missing))
              sys.exit(1)
          print("board profiles complete")
          EOF
