# ---- Recycle Bin (trash) ----
# `del`/`erase` move matching files and directories into a hidden .trash
# folder; `undelete`/`trash restore` bring them back. Limits are enforced on
# every trash operation (oldest entries purged first).
recycle_bin:
  enable:
    value: 1
    type: bool
    description: "Enable the recycle bin; when 0, del/erase delete permanently again"
  path:
    value: "sd:/.trash"
    type: string
    description: "Trash folder path (hidden from plain dir)"
  max_bytes:
    value: 33554432
    type: uint64_t
    description: "Maximum total bytes kept in the trash before the oldest entries are purged"
    range: "0..2147483648"
  max_age_sec:
    value: 604800
    type: uint32_t
    description: "Maximum age in seconds of a trash entry before it is auto-purged"
    range: "0..31536000"
  max_entries:
    value: 256
    type: int
    description: "Maximum number of trash entries before the oldest are purged"
    range: "8..4096"
  operation_max:
    value: 256
    type: int
    description: "Maximum file matches collected by one recursive del /s operation"
    range: "8..4096"

# ---- Boot Scripting (CONFIG.SYS / AUTOEXEC.BAT) ----
boot_scripting:
  config_sys_name:
    value: "CONFIG.SYS"
    type: string
    description: "Filename checked for boot directives on the SD volume root"
  autoexec_bat_name:
    value: "AUTOEXEC.BAT"
    type: string
    description: "Filename checked for the boot batch file on the SD volume root"
  generate_defaults:
    value: 1
    type: uint8_t
    description: >-
      When CONFIG.SYS / AUTOEXEC.BAT are missing, generate default files once.
      When 0, missing files are silently skipped.
    range: "0..1"
  run_on_startup:
    value: 1
    type: uint8_t
    description: "Run CONFIG.SYS + AUTOEXEC.BAT on every normal boot"
    range: "0..1"
  line_bytes:
    value: 256
    type: uint16_t
    description: "Maximum line length accepted by the CONFIG.SYS parser"
    range: "64..1024"
  max_directives:
    value: 64
    type: uint16_t
    description: "Maximum number of directives CONFIG.SYS may contain"
    range: "16..256"
  script_task_stack:
    value: 16384
    type: size_t
    description: "Stack size for the dedicated task that applies CONFIG.SYS/AUTOEXEC.BAT once the SD card first mounts. Runs off the Wi-Fi event task so a slow AUTOEXEC cannot block Wi-Fi event delivery. Internal RAM because the script can run commands that touch flash/NVS."
    range: "8192..65536"
  io_buffer_bytes:
    value: 128
    type: size_t
    description: "I/O buffer size for SD file operations"
    range: "32..1024"
  sd_dma_buffer_bytes:
    value: 4096
    type: size_t
    description: "Pre-allocated SDMMC DMA scratch buffer cached on the host at mount (4096 in v0.35.1, 8 sectors); prevents per-transaction DMA allocation failures (allocate_dma_buf: not enough mem) when the internal DMA-capable heap fragments under load. Must be a multiple of the 512 B card sector; larger values speed multi-block transfers but reserve internal RAM permanently."
    range: "512..65536"
  sd_op_boost:
    value: 1
    type: bool
    description: "Raise the calling task priority for the duration of a guarded SD session (O6 fix). The shared SDMMC controller serializes slot 0 (SD) and slot 1 (hosted C6) on one unbounded mutex while hosted tasks run at 22 vs the worker at 2; the boost lets SD ops win arbitration instead of starving."
  sd_op_boost_priority:
    value: 23
    type: int
    description: "Priority used by the SD-session boost. Must outrank the hosted transport tasks (22); kept just above them. Restored on session exit with a worker-loop backstop."
    range: "3..24"
  sd_op_timing:
    value: 0
    type: bool
    description: "Enable the SD-op timing probe. Guarded sessions timestamp entry and shell_sd_end() logs ops slower than sd_op_timing_ms to the serial log. Off by default; enable for soaks hunting the O6 tail."
  sd_op_timing_ms:
    value: 500
    type: int
    description: "SD-op overshoot threshold in milliseconds for the timing probe."
    range: "50..60000"
  sd_op_retries:
    value: 3
    type: int
    description: "Attempts for idempotent read-only filesystem queries before reporting failure. Transient contention on the shared SDMMC controller can fail a query while the card is healthy; reads are side-effect free so retrying is safe. Writes are never retried implicitly."
    range: "1..10"
  sd_op_retry_delay_ms:
    value: 50
    type: int
    description: "Delay in milliseconds between read-only query attempts."
    range: "10..1000"
  config_max_bytes:
    value: 16384
    type: size_t
    description: "Maximum bytes the config command reads/writes for the CONFIG.SYS settings file"
    range: "4096..65536"
  ini_max_bytes:
    value: 16384
    type: size_t
    description: "Maximum bytes the generic INI (ini command, applib state) reads/writes for a KEY=VALUE config file on the SD card"
    range: "4096..65536"
  transcript_internal_trim_bytes:
    value: 4096
    type: size_t
    description: "Internal (DMA-capable) heap free threshold in bytes that triggers an automatic transcript scrollback trim. Lowered to 4096 in v0.35.4 (dir scratch buffers moved to PSRAM, so internal heap rarely drops below this); trim keeps newest 3/4 and is rate-limited to one per 2 s."
    range: "2048..1048576"
  temp_dir_name:
    value: "tmp"
    type: string
    description: "Name of the directory (under the SD mount point) where temporary files live; all temp files live on the SD card"
    range: "any valid SD directory name"

