# P4MiniShell Configuration � Single Source of Truth
#
# Every tunable value in the firmware is documented here with:
#   - value: the current setting
#   - type: C type for the generated header
#   - description: what it controls
#   - range: valid range or constraint
#
# The companion C header is p4minishell_config.h.
# board_config.yaml remains the hardware-pin source of truth.
# sdkconfig remains the ESP-IDF build-configuration source of truth.
#
# Version: 0.24.14
# Last updated: 2026-08-10 (Full printable-ASCII keyboard: the on-screen
#                           symbols keyboard now includes the shell-critical
#                           pipe |, caret ^, tilde ~ and backtick characters
#                           via a custom LVGL keyboard map)
config_version: "0.24.14"

# ---- Shell Identity ----
shell_identity:
  log_tag:
    value: "p4minishell"
    type: string
    description: "ESP_LOGx tag for shell-layer messages"
  board_requested:
    value: "JC1060P470C"
    type: string
    description: "User-requested board name"
  board_detected:
    value: "ESP32-P4-Function-EV-Board"
    type: string
    description: "Board name detected from BSP component"
  boot_message:
    value: "P4MiniShell v0.2 ready | JC1060P470C | type help"
    type: string
    description: "Startup banner shown in transcript"
  shell_prompt:
    value: "P4Shell> "
    type: string
    description: "Prompt string on input line and serial console"

# ---- Transcript and Command Buffers ----
buffers:
  transcript_bytes:
    value: 8192
    type: size_t
    description: "Maximum bytes in on-screen transcript buffer"
    range: "1024..65536"
  transcript_recolor_bytes:
    value: 16384
    type: size_t
    description: >-
      Maximum bytes of LVGL recolor markup staged for the on-screen transcript
      label. The recolor form (#RRGGBB text #) inflates the raw ANSI text by
      roughly 1.5-2x because every colour change carries an open/close marker,
      so a full 8 KiB transcript needs ~16 KiB of recolor markup. Sized at 2x
      the plain transcript so the entire scrollback fits on the label.
    range: "2048..131072"
  async_transcript_bytes:
    value: 2048
    type: size_t
    description: "Maximum bytes in async transcript staging buffer"
    range: "256..8192"
  command_bytes:
    value: 256
    type: size_t
    description: "Maximum bytes for a single command line"
    range: "64..1024"
  command_history_depth:
    value: 10
    type: size_t
    description: "Number of commands in recall history"
    range: "1..100"
  debug_log_depth:
    value: 5
    type: size_t
    description: "Number of entries in debug/error ring buffer"
    range: "1..32"
  debug_entry_bytes:
    value: 192
    type: size_t
    description: "Maximum bytes per debug log entry"
    range: "32..512"

# ---- UI Layout ----
ui_layout:
  keyboard_height:
    value: 240
    type: int
    description: "On-screen LVGL keyboard height in pixels"
    range: "100..600"
  header_refresh_period_ms:
    value: 5000
    type: int
    description: "Header status refresh timer period in milliseconds"
    range: "1000..30000"
  input_row_height:
    value: 52
    type: int
    description: "Input row (prompt line) height in pixels"
    range: "32..100"

# ---- Display Manager ----
# Managed by: components/display/display.c
# All display state (rotation, brightness, power) is owned by the display manager.
# Shell commands route through display manager public API.
display:
  default_brightness_percent:
    value: 100
    type: int
    description: "Default backlight brightness on boot (0-100)"
    range: "0..100"
  default_rotation:
    value: 0
    type: int
    description: "Default display rotation on boot (0, 90, 180, or 270)"
    range: "0|90|180|270"
  default_power_state:
    value: "on"
    type: string
    description: "Default display power state on boot (on, sleep, off)"
    range: "on|sleep|off"
  refresh_rate_dynamic_supported:
    value: false
    type: bool
    description: "Whether dynamic refresh rate changes are supported by the panel"
  panel_driver:
    value: "JD9165"
    type: string
    description: "Display panel driver name for diagnostics"
  touch_driver:
    value: "GT911"
    type: string
    description: "Touch controller driver name for diagnostics"

# ---- Window Manager ----
# Managed by: components/windows/windows.c
# All LVGL screen layout, scaling, and styling is owned by the window manager.
# Works together with display.c for resolution queries and header.c for status bar.
windows:
  header_height_pct:
    value: 7
    type: int
    description: "Header height as percentage of display height"
    range: "3..15"
  header_height_min:
    value: 32
    type: int
    description: "Header height minimum clamp in pixels"
    range: "24..64"
  header_height_max:
    value: 56
    type: int
    description: "Header height maximum clamp in pixels"
    range: "40..80"
  input_row_height_pct:
    value: 8
    type: int
    description: "Input row height as percentage of display height"
    range: "4..15"
  input_row_height_min:
    value: 40
    type: int
    description: "Input row height minimum clamp in pixels"
    range: "32..64"
  input_row_height_max:
    value: 56
    type: int
    description: "Input row height maximum clamp in pixels"
    range: "40..80"
  keyboard_height_pct:
    value: 35
    type: int
    description: "Keyboard height as percentage of display height"
    range: "20..50"
  keyboard_height_min:
    value: 180
    type: int
    description: "Keyboard height minimum clamp in pixels"
    range: "100..300"
  keyboard_height_max:
    value: 280
    type: int
    description: "Keyboard height maximum clamp in pixels"
    range: "200..400"
  transcript_height_min:
    value: 40
    type: int
    description: "Minimum transcript height in pixels"
    range: "20..200"

# ---- Wi-Fi ----
wifi:
  ssid_bytes:
    value: 33
    type: size_t
    description: "Maximum SSID length including null terminator"
    range: "1..33"
  password_bytes:
    value: 65
    type: size_t
    description: "Maximum password length including null terminator"
    range: "1..65"
  detail_bytes:
    value: 256
    type: size_t
    description: "Maximum Wi-Fi detail/status message length"
    range: "64..1024"
  origin_bytes:
    value: 32
    type: size_t
    description: "Maximum Wi-Fi origin/backend description length"
    range: "16..128"
  default_ssid:
    value: ""
    type: string
    description: "Default SSID from sdkconfig (empty if not set)"
  default_password:
    value: ""
    type: string
    description: "Default password from sdkconfig (empty if not set)"
  runtime_enabled_guard:
    value: "CONFIG_ESP_WIFI_ENABLED || CONFIG_ESP_HOST_WIFI_ENABLED || CONFIG_ESP_HOSTED_ENABLED"
    type: macro
    description: "Compile-time guard for Wi-Fi runtime code"
  hosted_skip_version_gate:
    value: 0
    type: bool
    description: >-
      Skip ESP-Hosted version compatibility gate. When 1, the Wi-Fi and
      Bluetooth init paths do not reject C6 firmware version mismatches.
      Useful for development and testing with mismatched host/co-processor
      firmware. Set to 0 in production to enforce the version gate.
  scan_limit:
    value: 32
    type: size_t
    description: >-
      Maximum access points surfaced by wifi scan. Results are sorted by RSSI
      (strongest first) and capped at this value so a busy channel cannot flood
      the transcript.
    range: "1..128"

# ---- Ping and DNS ----
# `ping` and `dns` (alias `nslookup`) are classic DOS-style connectivity
# commands implemented inside components/networking, the sole owner of the
# lwIP / esp_ping surface. They set ERRORLEVEL so batch files can branch, and
# they participate in redirection and pipes like every other command.
ping_dns:
  ping_count_default:
    value: 4
    type: int
    description: "Default echo-request count for ping when no count is given"
    range: "1..10"
  ping_count_max:
    value: 10
    type: int
    description: "Hard upper bound for ping <host> <count>; larger requests are clamped"
    range: "1..100"
  ping_timeout_ms:
    value: 1000
    type: uint32_t
    description: >-
      Milliseconds each ping waits for a single reply before reporting a
      timeout. Also bounds how long the command worker task can block per reply.
    range: "100..60000"
  ping_interval_ms:
    value: 1000
    type: uint32_t
    description: "Milliseconds between two consecutive ping echo requests"
    range: "10..60000"
  ping_data_bytes:
    value: 32
    type: uint32_t
    description: "Payload size in bytes of each ICMP echo request"
    range: "0..1024"
  dns_result_limit:
    value: 8
    type: size_t
    description: "Maximum A records dns / nslookup prints for one hostname"
    range: "1..32"

# ---- HTTP Client (httpget / wget) ----
# `httpget <url> [localfile]` performs a simple HTTPS or HTTP GET through the
# esp_http_client stack (the same one c6ota uses for firmware downloads). All
# HTTP / TLS code lives inside components/networking; the command layer only
# dispatches and writes the returned body to SD. ERRORLEVEL is 0 on an HTTP
# 2xx, non-zero otherwise.
http_client:
  timeout_ms:
    value: 15000
    type: uint32_t
    description: "Network timeout in milliseconds for a single httpget request"
    range: "1000..120000"
  max_body_bytes:
    value: 524288
    type: size_t
    description: >-
      Maximum response body bytes httpget buffers into PSRAM. A larger
      response is refused with a clear error rather than exhausting memory.
    range: "1024..4194304"
  follow_redirects:
    value: 1
    type: bool
    description: "Follow HTTP redirects (1) or treat a 3xx status as an error (0)"
  user_agent:
    value: "P4MiniShell/0.24.11 httpget"
    type: string
    description: "User-Agent string sent by httpget; kept short and identifiable"
  print_body_bytes:
    value: 4096
    type: size_t
    description: >-
      Maximum response body bytes printed to the transcript when no localfile
      is given. The full body is always available via httpget <url> <localfile>.
    range: "256..65536"

# ---- Bluetooth ----
