  idle_timeout_ms:
    value: 4000
    type: uint32_t
    description: "Milliseconds of no incoming data before a receive transfer aborts"
    range: "100..60000"
  send_timeout_ms:
    value: 10000
    type: uint32_t
    description: "Milliseconds a raw send/screenshot write may wait for TX ring space before aborting, so a host that stops reading never hangs the worker"
    range: "100..60000"
  send_max_bytes:
    value: 16777216
    type: uint32_t
    description: "Hard upper bound (bytes) for a single send stream, including send /diag"
    range: "1024..67108864"
  rx_max_bytes:
    value: 25165824
    type: uint32_t
    description: "Hard upper bound (bytes) for a single receive payload (sized for the 17 MB CJK board font; streams to SD)"
    range: "1024..67108864"
  rx_ready_marker:
    value: "=== RX READY ==="
    type: string
    description: "Magic marker printed before a receive starts streaming"
  rx_done_marker:
    value: "=== RX DONE ==="
    type: string
    description: "Magic marker printed after a receive completes successfully"
  tx_done_marker:
    value: "=== TX DONE ==="
    type: string
    description: "Magic marker printed after a send completes successfully"
  send_magic:
    value: "SDFX"
    type: string
    description: "Four-byte magic prefix of the send framed payload"
  diag_bytes:
    value: 1024
    type: size_t
    description: "Maximum size in bytes of the send /diag diagnostic report payload"
    range: "256..4096"
crypt:
  chunk_bytes:
    value: 4096
    type: size_t
    description: "Bytes encrypted per chunk during a crypt file run"
    range: "1024..16384"
  pbkdf2_iters:
    value: 10000
    type: int
    description: "PBKDF2 iterations for the crypt file key"
    range: "1000..100000"
  salt_bytes:
    value: 16
    type: int
    description: "Salt bytes mixed into the crypt key derivation"
    range: "8..32"
  pass_bytes:
    value: 128
    type: int
    description: "Maximum password characters accepted by crypt (plus the terminator)"
    range: "16..256"

# =============================================================================
# BUILD-AFFECTING KCONFIG OPTIONS
# =============================================================================
# These are ESP-IDF Kconfig settings that affect firmware behavior and are
# pinned in sdkconfig.defaults. They are documented here so developers have a
# single source of truth, but their canonical location is sdkconfig.defaults.

build_constraints:
  spiram_xip_from_psram:
    value: "n"
    type: bool
    description: >-
      Disable PSRAM XIP instruction/rodata mapping. Must stay disabled or the
      flash/PSRAM budget overflows at link time. Pinned in sdkconfig.defaults.
  compiler_optimization:
    value: "size"
    type: string
    description: >-
      Compiler optimization level. Size (-Os) keeps the image within budget;
      Performance (-O3) grows it by roughly 280 KB. Pinned in sdkconfig.defaults.
    options: ["size", "perf", "debug", "none"]
  log_default_level:
    value: "warn"
    type: string
    description: >-
      Compile-time log level. Warn keeps the console usable without debug spam.
      Pinned in sdkconfig.defaults.
    options: ["none", "error", "warn", "info", "debug", "verbose"]
  wifi_softap_support:
    value: "n"
    type: bool
    description: >-
      Disable Wi-Fi SoftAP support. Station-only is enforced structurally: both
      CONFIG_ESP_WIFI_SOFTAP_SUPPORT and CONFIG_WIFI_RMT_SOFTAP_SUPPORT must be
      disabled because esp_wifi_remote mirrors the Wi-Fi Kconfig under its own
      WIFI_RMT_ prefix. Pinned in sdkconfig.defaults.
  wifi_rmt_softap_support:
    value: "n"
    type: bool
    description: >-
      Mirror of CONFIG_ESP_WIFI_SOFTAP_SUPPORT for the esp_wifi_remote component.
      Both symbols must be disabled together. Pinned in sdkconfig.defaults.
# ---- Database (db) ----
database:
  db_max_databases:
    value: 64
    type: int
    description: "Maximum number of named databases on the card (sd:/DBS/<name>.DB/)."
  db_max_records:
    value: 256
    type: int
    description: "Maximum records (soft-deleted included) in a single database."
  db_record_max_bytes:
    value: 4096
    type: int
    description: "Maximum payload bytes for a single record (text or binary)."
  db_find_max:
    value: 64
    type: int
    description: "Maximum results returned by a db find scan (bounded, linear)."
  db_name_bytes:
    value: 32
    type: int
    description: "Maximum characters in a database name (the directory part of the path)."
  db_key_bytes:
    value: 32
    type: int
    description: "Maximum characters in a record key."
  db_index_line_bytes:
    value: 128
    type: int
    description: "Maximum length of one INDEX.TXT line (id cat flags key size)."
  db_category_count:
    value: 16
    type: int
    description: "Number of categories (0..15), Palm-OS style."
  db_id_bytes:
    value: 8
    type: int
    description: "Maximum characters in the stored creator/type id strings."
  db_export_max_records:
    value: 256
    type: int
    description: "Maximum lines in one db export / db import text file."
  db_export_max_bytes:
    value: 262144
    type: int
    description: "Maximum bytes in one db export / db import text file."
  db_field_value_bytes:
    value: 64
    type: int
    description: "Maximum bytes of one k=v field value read by db find /field: and db get /field:."
  db_flag_secret:
    value: 1
    type: int
    description: "Record flag bit for secret/redacted payloads (P4_CONFIG_DB_FLAG_SECRET)."

# ---- Alarm / Calendar (alarm, cal) ----
alarm:
  alarm_max_events:
    value: 64
    type: int
    description: "Maximum events stored at once (also bounds the checker's per-poll scan)."
  alarm_title_bytes:
    value: 48
    type: int
    description: "Maximum characters in an alarm title."
  alarm_msg_bytes:
    value: 160
    type: int
    description: "Maximum characters in an alarm message (header notification width)."
  alarm_poll_ms:
    value: 30000
    type: int
    description: "Checker poll interval in milliseconds (fires within this granularity)."
  alarm_task_stack:
    value: 8192
    type: int
    description: "Stack size for the background alarm checker task (snprintf + event/path locals need headroom)."
  alarm_task_priority:
    value: 1
    type: int
    description: "Priority of the alarm checker task."
  alarm_path:
    value: "sd:/ALARMS"
    type: string
    description: "Base directory for the alarm store (INDEX.INI + one E<id>.INI per event)."
  alarm_catchup_on_boot:
    value: 1
    type: bool
    description: "Fire once on boot for alarms that became due while powered off."
  alarm_default_notify_secs:
    value: 5
    type: int
    description: "Default header-notification timeout in seconds when an alarm fires."
  alarm_enable_run_action:
    value: 1
    type: bool
    description: "Compile out the /run: batch action entirely for size (0 = keep it)."
