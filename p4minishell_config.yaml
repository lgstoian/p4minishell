  storage_free_margin_bytes:
    value: 65536
    type: uint64_t
    description: "Free-space safety margin; a write leaving less than this free is refused"
    range: "0..1048576"
  copy_progress_threshold:
    value: 262144
    type: uint64_t
    description: "File size above which copy reports progress"
    range: "0..16777216"
  copy_progress_step_pct:
    value: 10
    type: int
    description: "Percent step between copy progress updates for large files"
    range: "1..50"
  format_confirm_word:
    value: "YES"
    type: string
    description: "Exact confirmation word required by the destructive format command"
  destructive_confirm_word:
    value: "YES"
    type: string
