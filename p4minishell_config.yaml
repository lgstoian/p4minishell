    value: 8192
    type: size_t
    description: >-
      Main task stack (CONFIG_ESP_MAIN_TASK_STACK_SIZE). The default 3584 overflows
      during shell_build_ui() because app_main builds the entire LVGL UI including
      transcript append and prompt rendering, which invoke the vfprintf machinery.
      8192 matches the command worker task budget. Pinned in sdkconfig.defaults.
    range: "4096..32768"
  system_event:
    value: 8192
    type: size_t
    description: >-
      System event task stack (CONFIG_ESP_SYSTEM_EVENT_TASK_STACK_SIZE). The default
      2304 overflows when the Wi-Fi event handler calls networking_schedulef_ansi()
      and networking_notify_headerf(), which invoke vsnprintf on the handler's stack.
      8192 gives the handler path real headroom. Pinned in sdkconfig.defaults.
    range: "4096..32768"

