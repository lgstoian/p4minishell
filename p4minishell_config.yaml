      When CONFIG.SYS / AUTOEXEC.BAT are missing, generate default files once.
      When 0, missing files are silently skipped.
    range: "0..1"
  run_on_startup:
    value: 1
    type: uint8_t
    description: "Run CONFIG.SYS + AUTOEXEC.BAT on every normal boot"
    range: "0..1"
