    type: size_t
    description: "Maximum BLE scan results to report"
    range: "1..64"
  name_bytes:
    value: 32
    type: size_t
    description: "Maximum Bluetooth device name string length"
    range: "8..128"
  addr_bytes:
    value: 18
    type: size_t
    description: "Maximum Bluetooth address string length (XX:XX:XX:XX:XX:XX)"
    range: "18"
  hosted_runtime_supported:
    value: 0
    type: bool
    description: "Legacy Bluedroid compile gate (0=disabled, 1=enabled)"
  scan_limit:
    value: 8
    type: size_t
    description: "Maximum BLE scan results surfaced via shell bt/scan"
    range: "1..32"
  scan_duration_ms:
    value: 8000
    type: uint32_t
    description: >-
      Duration in milliseconds of a single bluetooth scan run. The scan is
      bounded so the command always terminates and the worker task never hangs.
    range: "1000..60000"

