  path_bytes:
    value: 320
    type: size_t
    description: "Maximum resolved SD path length"
    range: "64..1024"
  list_limit:
    value: 128
    type: size_t
    description: "Maximum directory entries per sd ls"
    range: "16..512"
  cat_default_bytes:
    value: 1024
    type: size_t
    description: "Default preview size for sd cat"
    range: "64..8192"
  cat_max_bytes:
    value: 8192
    type: size_t
    description: "Maximum preview size for sd cat"
    range: "256..32768"
  dir_sort_entry_max:
    value: 128
    type: int
    description: "Maximum entries buffered per directory level for dir sorting"
    range: "16..512"
  dir_wide_columns:
    value: 4
    type: int
    description: "Columns printed by dir /w"
    range: "2..8"
  dir_wide_column_width:
    value: 18
    type: int
