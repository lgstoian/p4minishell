# P4MiniShell Configuration � Single Source of Truth
#
# Every tunable value in the firmware is documented here with:
#   - value: the current setting
#   - type: C type for the generated header
#   - description: what it controls
#   - range: valid range or constraint
#
# The companion C header is p4minishell_config.h.
# board_config.yaml remains the hardware-pin source of truth.
# sdkconfig remains the ESP-IDF build-configuration source of truth.
#
# Version: 0.24.27
# Last updated: 2026-08-11 (Aliases / macros: DOSKEY-style alias and unalias
#                           commands with RAM-only macro table and persistence
#                           to an SD profile auto-loaded after CONFIG.SYS)
config_version: "0.24.27"

# ---- Shell Identity ----
shell_identity:
  log_tag:
    value: "p4minishell"
    type: string
    description: "ESP_LOGx tag for shell-layer messages"
  board_requested:
    value: "JC1060P470C"
    type: string
    description: "User-requested board name"
  board_detected:
    value: "ESP32-P4-Function-EV-Board"
    type: string
    description: "Board name detected from BSP component"
  boot_message:
    value: "P4MiniShell v0.2 ready | JC1060P470C | type help"
    type: string
    description: "Startup banner shown in transcript"
  shell_prompt:
    value: "P4Shell> "
    type: string
    description: "Prompt string on input line and serial console"

# ---- Transcript and Command Buffers ----
buffers:
  transcript_bytes:
    value: 16384
    type: size_t
    description: >-
      Maximum bytes stored in the on-screen transcript buffer (scrollback).
      Kept modest because the buffer lives in internal RAM: growing it past
      this starves the internal/DMA heap and the heap init aborts at boot.
    range: "1024..32768"
  transcript_recolor_bytes:
    value: 16384
    type: size_t
    description: >-
      Maximum bytes staged for the on-screen transcript span group. The staged
      copy is the raw ANSI transcript, so it only needs to hold the same size
      as the transcript itself (the span group renders SGR escapes directly,
      no recolor inflation).
    range: "1024..32768"
  transcript_scroll_step:
    value: 60
    type: int
    description: >-
      Pixels the transcript scrolls per input-row Up/Dn button press and per
      USB mouse wheel notch.
    range: "16..300"
  transcript_scroll_follow_px:
    value: 32
    type: int
    description: >-
      Near-bottom follow threshold in pixels. When the view is within this
      distance of the bottom, new output keeps it pinned to the newest lines.
      Submitting a command always forces a jump to the bottom regardless.
    range: "0..200"
  async_transcript_bytes:
    value: 2048
    type: size_t
    description: "Maximum bytes in async transcript staging buffer"
    range: "256..8192"
  command_bytes:
    value: 256
    type: size_t
    description: "Maximum bytes for a single command line"
    range: "64..1024"
  command_history_depth:
    value: 10
    type: size_t
    description: "Number of commands in recall history"
    range: "1..100"
  debug_log_depth:
    value: 5
    type: size_t
    description: "Number of entries in debug/error ring buffer"
    range: "1..32"
  debug_entry_bytes:
    value: 192
    type: size_t
    description: "Maximum bytes per debug log entry"
    range: "32..512"

# ---- Clock and SNTP ----
# Managed by: components/clock/clock.c + clock_commands.c
# The clock component owns the C-library system clock, timezone, and the SNTP
# client. `date`, `time`, `timezone`, and `sntp`/`ntpsync` surface it from the
# shell (the command bodies live in the clock component and render through the
# clock_host_ops_t table registered by the command module).
clock:
  ntp_server:
    value: "pool.ntp.org"
    type: string
    description: "NTP server hostname the SNTP client polls"
    range: "any resolvable hostname"
  timezone_bytes:
    value: 64
    type: size_t
    description: "Maximum timezone string length (POSIX TZ string)"
    range: "16..128"

# ---- UI Layout ----
ui_layout:
  keyboard_height:
    value: 240
    type: int
    description: "On-screen LVGL keyboard height in pixels"
    range: "100..600"
  header_refresh_period_ms:
    value: 5000
    type: int
    description: "Header status refresh timer period in milliseconds"
    range: "1000..30000"
  input_row_height:
    value: 52
    type: int
    description: "Input row (prompt line) height in pixels"
    range: "32..100"

# ---- Display Manager ----
# Managed by: components/display/display.c
# All display state (rotation, brightness, power) is owned by the display manager.
# Shell commands route through display manager public API.
display:
  default_brightness_percent:
    value: 100
    type: int
    description: "Default backlight brightness on boot (0-100)"
    range: "0..100"
  default_rotation:
    value: 0
    type: int
    description: "Default display rotation on boot (0, 90, 180, or 270)"
    range: "0|90|180|270"
  default_power_state:
    value: "on"
    type: string
    description: "Default display power state on boot (on, sleep, off)"
    range: "on|sleep|off"
  refresh_rate_dynamic_supported:
    value: false
    type: bool
    description: "Whether dynamic refresh rate changes are supported by the panel"
  panel_driver:
    value: "JD9165"
    type: string
    description: "Display panel driver name for diagnostics"
  touch_driver:
    value: "GT911"
    type: string
    description: "Touch controller driver name for diagnostics"

# ---- Window Manager ----
# Managed by: components/windows/windows.c
# All LVGL screen layout, scaling, and styling is owned by the window manager.
# Works together with display.c for resolution queries and header.c for status bar.
windows:
  header_height_pct:
    value: 7
    type: int
    description: "Header height as percentage of display height"
    range: "3..15"
  header_height_min:
    value: 32
    type: int
    description: "Header height minimum clamp in pixels"
    range: "24..64"
  header_height_max:
    value: 56
    type: int
    description: "Header height maximum clamp in pixels"
    range: "40..80"
  input_row_height_pct:
    value: 8
    type: int
    description: "Input row height as percentage of display height"
    range: "4..15"
  input_row_height_min:
    value: 40
    type: int
    description: "Input row height minimum clamp in pixels"
    range: "32..64"
  input_row_height_max:
    value: 56
    type: int
    description: "Input row height maximum clamp in pixels"
    range: "40..80"
  scroll_button_width:
    value: 64
    type: int
    description: "Width of the transcript scroll buttons (input-row Up/Dn) in pixels"
    range: "40..120"
  keyboard_height_pct:
    value: 35
    type: int
    description: "Keyboard height as percentage of display height"
    range: "20..50"
  keyboard_height_min:
    value: 180
    type: int
    description: "Keyboard height minimum clamp in pixels"
    range: "100..300"
  keyboard_height_max:
    value: 280
    type: int
    description: "Keyboard height maximum clamp in pixels"
    range: "200..400"
  transcript_height_min:
    value: 40
    type: int
    description: "Minimum transcript height in pixels"
    range: "20..200"

# ---- Wi-Fi ----
wifi:
  ssid_bytes:
    value: 33
    type: size_t
    description: "Maximum SSID length including null terminator"
    range: "1..33"
  password_bytes:
    value: 65
    type: size_t
    description: "Maximum password length including null terminator"
    range: "1..65"
  detail_bytes:
    value: 256
    type: size_t
    description: "Maximum Wi-Fi detail/status message length"
    range: "64..1024"
  origin_bytes:
    value: 32
    type: size_t
    description: "Maximum Wi-Fi origin/backend description length"
    range: "16..128"
  default_ssid:
    value: ""
    type: string
    description: "Default SSID from sdkconfig (empty if not set)"
  default_password:
    value: ""
    type: string
    description: "Default password from sdkconfig (empty if not set)"
  runtime_enabled_guard:
    value: "CONFIG_ESP_WIFI_ENABLED || CONFIG_ESP_HOST_WIFI_ENABLED || CONFIG_ESP_HOSTED_ENABLED"
    type: macro
    description: "Compile-time guard for Wi-Fi runtime code"
  hosted_skip_version_gate:
    value: 0
    type: bool
    description: >-
      Skip ESP-Hosted version compatibility gate. When 1, the Wi-Fi and
      Bluetooth init paths do not reject C6 firmware version mismatches.
      Useful for development and testing with mismatched host/co-processor
      firmware. Set to 0 in production to enforce the version gate.
  scan_limit:
    value: 32
    type: size_t
    description: >-
      Maximum access points surfaced by wifi scan. Results are sorted by RSSI
      (strongest first) and capped at this value so a busy channel cannot flood
      the transcript.
    range: "1..128"
  known_max:
    value: 16
    type: size_t
    description: >-
      Maximum number of previously-used Wi-Fi networks kept in the persistent
      known-network list (sd:/WIFI.KNOWN). When full, the least preferred /
      lowest-priority / oldest entry is dropped.
    range: "4..64"
  known_file:
    value: "WIFI.KNOWN"
    type: string
    description: >-
      SD-card relative filename of the persistent known-network list. Resolved
      against the SD root via shell_sd_resolve_path(). Plain, hand-editable text.
    range: "any valid SD filename"
  known_autosave:
    value: 1
    type: bool
    description: >-
      When 1, a successful Wi-Fi connection (interactive wifi connect, CONFIG.SYS
      WIFI_SSID/WIFI_PASSWORD, or known-network auto-connect) automatically updates
      the known-network list on the SD card when the card is mounted. When 0, only
      the explicit wifi save command persists to the list.
  known_line_bytes:
    value: 256
    type: size_t
    description: "Maximum bytes for a single line in the known-network file"
    range: "64..512"

# ---- Ping and DNS ----
# `ping` and `dns` (alias `nslookup`) are classic DOS-style connectivity
# commands implemented inside components/networking, the sole owner of the
# lwIP / esp_ping surface. They set ERRORLEVEL so batch files can branch, and
# they participate in redirection and pipes like every other command.
ping_dns:
  ping_count_default:
    value: 4
    type: int
    description: "Default echo-request count for ping when no count is given"
    range: "1..10"
  ping_count_max:
    value: 10
    type: int
    description: "Hard upper bound for ping <host> <count>; larger requests are clamped"
    range: "1..100"
  ping_timeout_ms:
    value: 1000
    type: uint32_t
    description: >-
      Milliseconds each ping waits for a single reply before reporting a
      timeout. Also bounds how long the command worker task can block per reply.
    range: "100..60000"
  ping_interval_ms:
    value: 1000
    type: uint32_t
    description: "Milliseconds between two consecutive ping echo requests"
    range: "10..60000"
  ping_data_bytes:
    value: 32
    type: uint32_t
    description: "Payload size in bytes of each ICMP echo request"
    range: "0..1024"
  dns_result_limit:
    value: 8
    type: size_t
    description: "Maximum A records dns / nslookup prints for one hostname"
    range: "1..32"

# ---- HTTP Client (httpget / wget) ----
# `httpget <url> [localfile]` performs a simple HTTPS or HTTP GET through the
# esp_http_client stack (the same one c6ota uses for firmware downloads). All
# HTTP / TLS code lives inside components/networking; the command layer only
# dispatches and writes the returned body to SD. ERRORLEVEL is 0 on an HTTP
# 2xx, non-zero otherwise.
http_client:
  timeout_ms:
    value: 15000
    type: uint32_t
    description: "Network timeout in milliseconds for a single httpget request"
    range: "1000..120000"
  max_body_bytes:
    value: 524288
    type: size_t
    description: >-
      Maximum response body bytes httpget buffers into PSRAM. A larger
      response is refused with a clear error rather than exhausting memory.
    range: "1024..4194304"
  follow_redirects:
    value: 1
    type: bool
    description: "Follow HTTP redirects (1) or treat a 3xx status as an error (0)"
  user_agent:
    value: "P4MiniShell/0.24.11 httpget"
    type: string
    description: "User-Agent string sent by httpget; kept short and identifiable"
  print_body_bytes:
    value: 4096
    type: size_t
    description: >-
      Maximum response body bytes printed to the transcript when no localfile
      is given. The full body is always available via httpget <url> <localfile>.
    range: "256..65536"

# ---- HTTP File Server (httpd) ----
# A lightweight read-only HTTP file server that shares the SD card over the
# Wi-Fi link. It starts automatically when the station gets an IP (unless
# disabled) and stops on disconnect. All HTTP server code lives inside
# components/networking (the sole owner of the esp_http_server surface).
http_server:
  port:
    value: 80
    type: uint16_t
    description: "Port the httpd file server listens on"
    range: "1..65535"
  max_open_sockets:
    value: 4
    type: uint16_t
    description: "Maximum simultaneous client sockets (3 reserved internally)"
    range: "1..16"
  backlog:
    value: 4
    type: uint16_t
    description: "TCP accept backlog for the server"
    range: "1..16"
  stack_bytes:
    value: 8192
    type: size_t
    description: "Stack bytes for the dedicated HTTP server task (handler builds path-sized scratch)"
    range: "2048..32768"
  task_priority:
    value: 5
    type: int
    description: "Priority of the HTTP server task"
    range: "1..25"
  recv_timeout_s:
    value: 5
    type: int
    description: "Receive timeout in seconds for an idle client socket"
    range: "1..120"
  send_timeout_s:
    value: 5
    type: int
    description: "Send timeout in seconds for a slow client socket"
    range: "1..120"
  block_bytes:
    value: 2048
    type: size_t
    description: "Bytes read per chunk when streaming a file (heap-allocated per request)"
    range: "256..65536"
  listing_max:
    value: 128
    type: int
    description: "Maximum directory-listing entries returned by the server"
    range: "16..1024"
  autostart:
    value: 1
    type: bool
    description: "Auto-start the server when the station gets an IP and stop it on disconnect; when 0 only the manual httpd start command starts it"
  auth_username:
    value: "admin"
    type: string
    description: "Basic-auth username; an empty string disables authentication"
  auth_password:
    value: "p4mini"
    type: string
    description: "Basic-auth password; used only when auth_username is set"

# ---- Network Diagnostics (netstat / ipconfig) ----
network_diag:
  netstat_row_max:
    value: 64
    type: int
    description: "Maximum rows printed by netstat per TCP/UDP list"
    range: "8..256"

# ---- RGB Status LED (WS2812 on GPIO26) ----
# The Guition JC1060P470 board has a WS2812 (NeoPixel) RGB LED on the back
# panel on GPIO26. components/led owns the driver (espressif/led_strip over
# RMT), the auto status layer (Wi-Fi state colours), and transient event
# notifications. The `rgb` shell command and the CONFIG.SYS `RGB=` directive
# drive it.
rgb_led:
  gpio:
    value: 26
    type: gpio_num_t
    description: "WS2812 data GPIO (LED1 on the JC1060P470 back panel)"
  rmt_resolution_hz:
    value: 10000000
    type: uint32_t
    description: "RMT tick resolution used by the WS2812 driver, in Hz"
    range: "1000000..80000000"
  rmt_symbols:
    value: 64
    type: size_t
    description: "RMT symbol blocks allocated for the one-LED strip"
    range: "48..256"
  max_brightness_pct:
    value: 50
    type: int
    description: "Maximum colour intensity as a percentage (scales every colour)"
    range: "1..100"
  task_stack_bytes:
    value: 2048
    type: size_t
    description: "Stack bytes for the LED animation/notification task"
    range: "1024..8192"
  tick_ms:
    value: 10
    type: int
    description: "Animation tick period in ms (frame rate of effects)"
    range: "5..100"
  notify_ms:
    value: 1500
    type: int
    description: "Duration in ms of a transient event notification colour"
    range: "100..10000"
  boot_flash_ms:
    value: 600
    type: int
    description: "Duration in ms of the boot-OK confirmation flash"
    range: "100..5000"
  effect_speed_default:
    value: 5
    type: int
    description: "Default effect speed for rgb <effect> [speed]"
    range: "1..10"
  auto_status:
    value: 1
    type: bool
    description: "Start with the auto status layer enabled (Wi-Fi state colours)"
  color_boot_ok:
    value: "0x00FF00"
    type: int
    description: "Boot confirmation colour as 0xRRGGBB"
  color_wifi_connecting:
    value: "0xFF9900"
    type: int
    description: "Wi-Fi connecting colour as 0xRRGGBB"
  color_wifi_connected:
    value: "0x00FF00"
    type: int
    description: "Wi-Fi connected colour as 0xRRGGBB"
  color_wifi_disconnected:
    value: "0xFF0000"
    type: int
    description: "Wi-Fi disconnected colour as 0xRRGGBB"
  color_wifi_error:
    value: "0xFF4040"
    type: int
    description: "Wi-Fi error colour as 0xRRGGBB"
  color_httpd:
    value: "0x0080FF"
    type: int
    description: "HTTP server started colour as 0xRRGGBB"


# ---- Bluetooth ----
bluetooth:
  log_tag:
    value: "bluetooth"
    type: string
    description: "ESP_LOGx tag for Bluetooth messages"
  device_name:
    value: "P4MiniShell BLE"
    type: string
    description: "BLE device name used during advertising"
  discovery_limit:
    value: 16
    type: size_t
    description: "Maximum BLE scan results to report"
    range: "1..64"
  name_bytes:
    value: 32
    type: size_t
    description: "Maximum Bluetooth device name string length"
    range: "8..128"
  addr_bytes:
    value: 18
    type: size_t
    description: "Maximum Bluetooth address string length (XX:XX:XX:XX:XX:XX)"
    range: "18"
  hosted_runtime_supported:
    value: 0
    type: bool
    description: "Legacy Bluedroid compile gate (0=disabled, 1=enabled)"
  scan_limit:
    value: 8
    type: size_t
    description: "Maximum BLE scan results surfaced via shell bt/scan"
    range: "1..32"
  scan_duration_ms:
    value: 8000
    type: uint32_t
    description: >-
      Duration in milliseconds of a single bluetooth scan run. The scan is
      bounded so the command always terminates and the worker task never hangs.
    range: "1000..60000"

