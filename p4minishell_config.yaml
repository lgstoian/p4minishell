# ---- Task Stacks ----
task_stacks:
  wifi_init:
    value: 6144
    type: size_t
    description: "Wi-Fi initialization background task stack"
    range: "4096..16384"
  command:
    value: 32768
    type: size_t
    description: >-
      Shell command worker task stack (P4_CONFIG_COMMAND_TASK_STACK). Raised
      24576 -> 32768 to accommodate recursive dir /S and deep batch+TUI
      call stacks; 48 KB was too large for task creation on ESP32-P4.
    range: "4096..65536"
  command_queue_depth:
    value: 32
    type: int
    description: "Async command queue depth, pointers only (P4_CONFIG_COMMAND_QUEUE_DEPTH); depth 4 dropped bursts, 16 then 32 (PSRAM-backed request payloads) in 2026-09"
    range: "4..64"
  command_queue_send_timeout_ms:
    value: 500
    type: int
    description: "Bounded submit wait on a full queue (P4_CONFIG_COMMAND_QUEUE_SEND_TIMEOUT_MS); LVGL/UART tasks only, cannot deadlock the worker"
    range: "0..5000"
  uart_console:
    value: 16384
    type: size_t
    description: "UART/serial console reader task stack (PSRAM-backed). Sized above the old 12 KB because the task also runs the streaming screenshot capture (LVGL snapshot) while a modal blocks the worker."
    range: "4096..32768"
  uart_mirror_write_timeout_ms:
    value: 50
    type: int
    description: "Bounded wait per segment of a UART transcript mirror write. The mirror bypasses the IDF VFS (which drops the whole line on a false connection-monitor disconnect); this bound stops a stalled TX ring from wedging the writer."
    range: "0..1000"
  uart_mirror_disconnect_grace_ms:
    value: 2000
    type: int
    description: "Grace period after the SOF connection monitor first reports disconnected before the mirror gives up. Tolerates the monitor's transient false disconnects (a few ms under load) so a single line is never dropped; only a persistent absence (no host) stops the mirror."
    range: "0..10000"
  lvgl:
    value: 12288
    type: size_t
    description: >-
      LVGL task stack (P4_CONFIG_LVGL_TASK_STACK), created by the BSP display
      driver. Raised above the 7168-byte esp_lvgl_port default because a
      full-screen redraw (transcript span group, input line, on-screen
      keyboard, header) recurses deep enough to overflow the stock stack
      into a boot-loop panic.
    range: "8192..32768"
  main_task:
    value: 8192
    type: size_t
    description: >-
      Main task stack (CONFIG_ESP_MAIN_TASK_STACK_SIZE). The default 3584 overflows
      during shell_build_ui() because app_main builds the entire LVGL UI including
      transcript append and prompt rendering, which invoke the vfprintf machinery.
      8192 matches the command worker task budget. Pinned in sdkconfig.defaults.
    range: "4096..32768"
  system_event:
    value: 8192
    type: size_t
    description: >-
      System event task stack (CONFIG_ESP_SYSTEM_EVENT_TASK_STACK_SIZE). The default
      2304 overflows when the Wi-Fi event handler calls networking_schedulef_ansi()
      and networking_notify_headerf(), which invoke vsnprintf on the handler's stack.
      8192 gives the handler path real headroom. Pinned in sdkconfig.defaults.
    range: "4096..32768"

