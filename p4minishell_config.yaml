# Phase 1: built-in bitmap names only; pixel sizes arrive with SD TTFs.
fonts:
  terminal_default:
    value: "unscii_16"
    type: string
    description: "Default primary for the terminal role (must be monospace)"
  ui_default:
    value: "unscii_16"
    type: string
    description: "Default primary for the UI role (chained with Montserrat fallback)"
  name_bytes:
    value: 32
    type: int
    description: "Maximum bytes for a font name (registry + SHELL.INI values)"
    range: "16..64"
  default_px:
    value: 16
    type: int
    description: "Nominal pixel size of built-in bitmap roles"
    range: "8..32"
  size_min:
    value: 10
    type: int
    description: "Minimum selectable TTF pixel size"
    range: "8..16"
  size_max:
    value: 28
    type: int
    description: "Maximum selectable TTF pixel size"
    range: "16..48"
  ttf_slots:
    value: 6
    type: int
    description: "Registry slots for loaded SD TTF objects ((stem, size) keyed)"
    range: "2..12"

# ---- TUI / Modal Surfaces ----
# Managed by: components/tui/tui.c + components/modal/modal_surf.c
# Logical grid (COLS x ROWS) is the DOS-like coordinate system batch files address
# with draw/locate (1-based). The pixel rect follows the transcript region
# dynamically (rotation / keyboard visibility).
tui:
  cols:
    value: 80
    type: int
    description: "Logical TUI grid columns (DOS 80 is the default; pixel width scales to the live transcript region)"
    range: "40..120"
  rows:
    value: 25
    type: int
    description: "Logical TUI grid rows (DOS 25 is the default; pixel height scales to the live transcript region)"
    range: "15..40"
  list_max_items:
    value: 64
    type: int
    description: "Maximum items list will show (truncates with a warning)"
    range: "16..128"
  browse_path_bytes:
    value: 320
    type: size_t
    description: "Maximum bytes for a file-browser selected path"
    range: "128..512"
  view_max_bytes:
    value: 65536
    type: size_t
    description: "Maximum file bytes the text viewer / hex viewer will load"
    range: "4096..262144"
  timeout_default_ms:
    value: 0
    type: uint32_t
    description: "Default auto-cancel timeout for modal surfaces in ms (0 = no timeout)"
    range: "0..60000"

# ---- Image (BMP) ----
image:
  max_bytes:
    value: 2097152
    type: size_t
    description: "Largest BMP the image path (viewer / draw image / gfx image) will ingest; the source is decoded straight to a fit-to-screen target so memory stays bounded"
    range: "65536..8388608"
  viewer_fit:
    value: 1
    type: int
    description: "Show the image viewer fit-to-screen (1) or at native size only (0)"
    range: "0..1"

# ---- Wi-Fi ----
wifi:
  ssid_bytes:
    value: 33
    type: size_t
    description: "Maximum SSID length including null terminator"
    range: "1..33"
  password_bytes:
    value: 65
    type: size_t
    description: "Maximum password length including null terminator"
    range: "1..65"
  detail_bytes:
    value: 256
    type: size_t
    description: "Maximum Wi-Fi detail/status message length"
    range: "64..1024"
  origin_bytes:
    value: 32
    type: size_t
    description: "Maximum Wi-Fi origin/backend description length"
    range: "16..128"
  default_ssid:
    value: ""
    type: string
    description: "Default SSID from sdkconfig (empty if not set)"
  default_password:
    value: ""
    type: string
    description: "Default password from sdkconfig (empty if not set)"
  runtime_enabled_guard:
    value: "CONFIG_ESP_WIFI_ENABLED || CONFIG_ESP_HOST_WIFI_ENABLED || CONFIG_ESP_HOSTED"
    type: macro
    description: "Compile-time guard for Wi-Fi runtime code"
  hosted_skip_version_gate:
    value: 0
    type: bool
    description: >-
      Skip ESP-Hosted version compatibility gate. When 1, the Wi-Fi and
      Bluetooth init paths do not reject C6 firmware version mismatches.
      Useful for development and testing with mismatched host/co-processor
      firmware. Set to 0 in production to enforce the version gate.
  hosted_compat_major:
    value: 3
    type: int
    description: >-
      ESP-Hosted wire-protocol major the host requires on the C6. esp_hosted
      3.x froze its public compat version macros at the 2.12.6 baseline, so
      the gate compares the C6-reported major against this instead.
  scan_limit:
    value: 32
    type: size_t
    description: >-
      Maximum access points surfaced by wifi scan. Results are sorted by RSSI
      (strongest first) and capped at this value so a busy channel cannot flood
      the transcript.
    range: "1..128"
  known_max:
    value: 16
    type: size_t
    description: >-
      Maximum number of previously-used Wi-Fi networks kept in the persistent
      known-network list (sd:/WIFI.KNOWN). When full, the least preferred /
      lowest-priority / oldest entry is dropped.
    range: "4..64"
  bench_chunk_bytes:
    value: 1460
    type: size_t
    description: "Payload bytes per send()/datagram for the wifi throughput bench (matches the Wi-Fi MTU)."
    range: "512..16384"
  bench_default_mb:
    value: 16
    type: size_t
    description: "Payload size (MiB) used by wifi throughput when mb=N is not given."
    range: "1..1024"
  bench_max_mb:
    value: 1024
    type: size_t
    description: "Upper bound on wifi throughput mb=N (guards against an accidental huge transfer)."
    range: "1..4096"
  bench_timeout_ms:
    value: 30000
    type: int
    description: "Overall transfer budget before the wifi throughput bench aborts."
    range: "1000..120000"
  bench_port:
    value: 5201
    type: int
    description: "Default TCP/UDP port for the wifi throughput bench (host endpoint: tools/wifi_bench.py)."
    range: "1..65535"
  known_file:
    value: "WIFI.KNOWN"
    type: string
    description: >-
      SD-card relative filename of the persistent known-network list. Resolved
      against the SD root via shell_sd_resolve_path(). Plain, hand-editable text.
    range: "any valid SD filename"
  known_autosave:
    value: 1
    type: bool
    description: >-
      When 1, a successful Wi-Fi connection (interactive wifi connect, CONFIG.SYS
      WIFI_SSID/WIFI_PASSWORD, or known-network auto-connect) automatically updates
      the known-network list on the SD card when the card is mounted. When 0, only
      the explicit wifi save command persists to the list.
  known_line_bytes:
    value: 256
    type: size_t
    description: "Maximum bytes for a single line in the known-network file"
    range: "64..512"

# ---- Ping and DNS ----
# `ping` and `dns` (alias `nslookup`) are classic DOS-style connectivity
# commands implemented inside components/networking, the sole owner of the
# lwIP / esp_ping surface. They set ERRORLEVEL so batch files can branch, and
# they participate in redirection and pipes like every other command.
ping_dns:
  ping_count_default:
    value: 4
    type: int
    description: "Default echo-request count for ping when no count is given"
    range: "1..10"
  ping_count_max:
    value: 10
    type: int
    description: "Hard upper bound for ping <host> <count>; larger requests are clamped"
    range: "1..100"
  ping_timeout_ms:
    value: 1000
    type: uint32_t
    description: >-
      Milliseconds each ping waits for a single reply before reporting a
      timeout. Also bounds how long the command worker task can block per reply.
    range: "100..60000"
  ping_interval_ms:
    value: 1000
    type: uint32_t
    description: "Milliseconds between two consecutive ping echo requests"
    range: "10..60000"
  ping_data_bytes:
    value: 32
    type: uint32_t
    description: "Payload size in bytes of each ICMP echo request"
    range: "0..1024"
  dns_result_limit:
    value: 8
    type: size_t
    description: "Maximum A records dns / nslookup prints for one hostname"
    range: "1..32"
tcp_terminal:
  connect_timeout_ms:
    value: 10000
    type: uint32_t
    description: "Milliseconds a tcpterm connect may take before it is abandoned"
    range: "1000..60000"
  idle_timeout_ms:
    value: 5000
    type: uint32_t
    description: "Default idle milliseconds with no reply data before tcpterm stops"
    range: "1000..120000"
  rx_max_bytes:
    value: 65536
    type: size_t
    description: "Maximum reply bytes a tcpterm session buffers/prints"
    range: "4096..262144"
  tx_max_bytes:
    value: 65536
    type: size_t
    description: "Maximum request bytes a tcpterm session sends"
    range: "1024..262144"

# ---- HTTP Client (httpget / wget) ----
# `httpget <url> [localfile]` performs a simple HTTPS or HTTP GET through the
# esp_http_client stack (the same one c6ota uses for firmware downloads). All
# HTTP / TLS code lives inside components/networking; the command layer only
# dispatches and writes the returned body to SD. ERRORLEVEL is 0 on an HTTP
# 2xx, non-zero otherwise.
http_client:
  timeout_ms:
    value: 15000
    type: uint32_t
    description: "Network timeout in milliseconds for a single httpget request"
    range: "1000..120000"
  max_body_bytes:
    value: 524288
    type: size_t
    description: >-
      Maximum response body bytes httpget buffers into PSRAM. A larger
      response is refused with a clear error rather than exhausting memory.
    range: "1024..4194304"
  follow_redirects:
    value: 1
    type: bool
    description: "Follow HTTP redirects (1) or treat a 3xx status as an error (0)"
  user_agent:
    value: "P4MiniShell/v0.31.0 httpget"
    type: string
    description: "User-Agent string sent by httpget; the C header assembles it from P4_CONFIG_VERSION_STRING so it tracks the firmware version"
  print_body_bytes:
    value: 4096
    type: size_t
    description: >-
      Maximum response body bytes printed to the transcript when no localfile
      is given. The full body is always available via httpget <url> <localfile>.
    range: "256..65536"

# ---- HTTP File Server (httpd) ----
# A lightweight read-only HTTP file server that shares the SD card over the
# Wi-Fi link. It starts automatically when the station gets an IP (unless
# disabled) and stops on disconnect. All HTTP server code lives inside
# components/networking (the sole owner of the esp_http_server surface).
http_server:
  port:
    value: 80
    type: uint16_t
    description: "Port the httpd file server listens on"
    range: "1..65535"
  max_open_sockets:
    value: 4
    type: uint16_t
    description: "Maximum simultaneous client sockets (3 reserved internally)"
    range: "1..16"
  backlog:
    value: 4
    type: uint16_t
    description: "TCP accept backlog for the server"
    range: "1..16"
  stack_bytes:
    value: 8192
    type: size_t
    description: "Stack bytes for the dedicated HTTP server task (handler builds path-sized scratch; 16384 could not allocate from fragmented internal heap at Wi-Fi-up time -> every start failed ESP_ERR_HTTPD_TASK, fixed 2026-09-06)"
    range: "2048..32768"
  task_priority:
    value: 5
    type: int
    description: "Priority of the HTTP server task"
    range: "1..25"
  recv_timeout_s:
    value: 5
    type: int
    description: "Receive timeout in seconds for an idle client socket"
    range: "1..120"
  send_timeout_s:
    value: 5
    type: int
    description: "Send timeout in seconds for a slow client socket"
    range: "1..120"
  block_bytes:
    value: 2048
    type: size_t
    description: "Bytes read per chunk when streaming a file (heap-allocated per request)"
    range: "256..65536"
  listing_max:
    value: 128
    type: int
    description: "Maximum directory-listing entries returned by the server"
    range: "16..1024"
  autostart:
    value: 1
    type: bool
    description: "Auto-start the server when the station gets an IP and stop it on disconnect; when 0 only the manual httpd start command starts it"
  autostart_retry_secs:
    value: 60
    type: int
    description: "Cooldown in seconds before auto-start retries after a failed start (e.g. ESP_ERR_HTTPD_TASK while the heap is tight); manual httpd start bypasses it"
    range: "5..3600"
  auth_username:
    value: "admin"
    type: string
    description: "Basic-auth username; an empty string disables authentication"
  auth_password:
    value: "p4mini"
    type: string
    description: "Basic-auth password; used only when auth_username is set"

