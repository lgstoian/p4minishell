# =============================================================================
# BUILD-AFFECTING KCONFIG OPTIONS
# =============================================================================
# These are ESP-IDF Kconfig settings that affect firmware behavior and are
# pinned in sdkconfig.defaults. They are documented here so developers have a
# single source of truth, but their canonical location is sdkconfig.defaults.

build_constraints:
  spiram_xip_from_psram:
    value: "n"
    type: bool
    description: >-
      Disable PSRAM XIP instruction/rodata mapping. Must stay disabled or the
      flash/PSRAM budget overflows at link time. Pinned in sdkconfig.defaults.
  compiler_optimization:
    value: "size"
    type: string
    description: >-
      Compiler optimization level. Size (-Os) keeps the image within budget;
      Performance (-O3) grows it by roughly 280 KB. Pinned in sdkconfig.defaults.
    options: ["size", "perf", "debug", "none"]
  log_default_level:
    value: "warn"
    type: string
    description: >-
      Compile-time log level. Warn keeps the console usable without debug spam.
      Pinned in sdkconfig.defaults.
    options: ["none", "error", "warn", "info", "debug", "verbose"]
  wifi_softap_support:
    value: "n"
    type: bool
    description: >-
      Disable Wi-Fi SoftAP support. Station-only is enforced structurally: both
      CONFIG_ESP_WIFI_SOFTAP_SUPPORT and CONFIG_WIFI_RMT_SOFTAP_SUPPORT must be
      disabled because esp_wifi_remote mirrors the Wi-Fi Kconfig under its own
      WIFI_RMT_ prefix. Pinned in sdkconfig.defaults.
  wifi_rmt_softap_support:
    value: "n"
    type: bool
    description: >-
      Mirror of CONFIG_ESP_WIFI_SOFTAP_SUPPORT for the esp_wifi_remote component.
      Both symbols must be disabled together. Pinned in sdkconfig.defaults.