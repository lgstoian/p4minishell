# P4MiniShell Configuration - Single Source of Truth
#
# Every tunable value in the firmware is documented here with:
#   - value: the current setting
#   - type: C type for the generated header
#   - description: what it controls
#   - range: valid range or constraint
#
# The companion C header is p4minishell_config.h.
# board_config.yaml remains the hardware-pin source of truth.
# sdkconfig remains the ESP-IDF build-configuration source of truth.
#
# Version: 1.0.0
# Last updated: 2026-09-15 (1.0.0: first public release - MIT relicensing,
#   documentation overhaul; firmware behaviour unchanged from 0.38.5)
config_version: "1.0.0"

# ---- Shell Identity ----
shell_identity:
  log_tag:
    value: "p4minishell"
    type: string
    description: "ESP_LOGx tag for shell-layer messages"
  board_requested:
    value: "JC1060P470C"
    type: string
    description: "User-requested board name"
  board_detected:
    value: "ESP32-P4-Function-EV-Board"
    type: string
    description: "Board name detected from BSP component"
  product_name:
    value: "P4MiniShell"
    type: string
    description: "Product display name used by the boot banner, version, about, and header long-press identity"
  copyright_notice:
    value: "Copyright (c) 2026 Stoian Alexandru. MIT License."
    type: string
    description: "Copyright/license notice surfaced by the `about` command and its license section"
  boot_message:
    value: "P4MiniShell v0.31.0 ready | JC1060P470C | type help"
    type: string
    description: "Startup banner shown in transcript (assembled from P4_CONFIG_VERSION_STRING and P4_CONFIG_BOARD_REQUESTED in the C header)"
  shell_prompt:
    value: "PS \\> "
    type: string
    description: "Prompt string on input line and serial console (assembled from P4_CONFIG_PS_PREFIX, P4_CONFIG_PS_PATH_SEPARATOR, and P4_CONFIG_PS_SUFFIX in the C header)"
  splash_enable:
    value: 1
    type: int
    range: "0-1"
    description: "Show the generated boot-splash icon overlay on the first UI build (0 = off)"
  splash_ms:
    value: 1500
    type: int
    range: "0-10000"
    description: "Boot-splash auto-dismiss delay in milliseconds; a tap dismisses it early. The 256x256 RGB565 asset is generated by tools/make_icon.py into main/assets/icon_splash.c"

# ---- Transcript and Command Buffers ----
buffers:
  transcript_bytes:
    value: 65536
    type: size_t
    description: >-
      Maximum bytes stored in the on-screen transcript buffer (scrollback).
      The buffer is allocated from PSRAM (with an internal-RAM fallback) so
      it does not compete with the DMA-capable heap used by the WiFi/SDIO
      transport mempool and the USB-Serial/JTAG ring buffers. Raised to
      65536 in v0.35.5: PSRAM is plentiful and the render staging copies
      moved to PSRAM as well, so long scrollback no longer costs internal RAM.
    range: "1024..65536"
  transcript_recolor_bytes:
    value: 65536
    type: size_t
    description: >-
      Maximum bytes staged for the on-screen transcript span group. The staged
      copy is the raw ANSI transcript, so it only needs to hold the same size
      as the transcript itself (recolor == transcript; the span group renders
      SGR escapes directly, no recolor inflation). Staged in PSRAM since
      v0.35.2 (was internal DRAM, which forced the very trims it existed to
      survive).
    range: "1024..65536"
  transcript_scroll_step:
    value: 60
    type: int
    description: >-
      Pixels the transcript scrolls per input-row Up/Dn button press and per
      USB mouse wheel notch.
    range: "16..300"
  transcript_scroll_follow_px:
    value: 32
    type: int
    description: >-
      Near-bottom follow threshold in pixels. When the view is within this
      distance of the bottom, new output keeps it pinned to the newest lines.
      Submitting a command always forces a jump to the bottom regardless.
    range: "0..200"
  transcript_flush_ms:
    value: 200
    type: int
    description: >-
      Maximum on-screen staleness of the transcript label in milliseconds
      while a command streams output. Repainting the span group costs
      O(buffer), so appends mark the label dirty and repaint at most this
      often (plus once per command, before key waits, and before screenshots);
      serial output stays live on every line.
    range: "0..2000"
  async_transcript_bytes:
    value: 512
    type: size_t
    description: "Maximum bytes in async transcript staging buffer (reduced to 512 in v0.35.3)"
    range: "256..8192"
  command_bytes:
    value: 4096
    type: size_t
    description: "Maximum bytes for a single command line (extremely long; transient buffers are heap-allocated)"
    range: "256..8192"
  command_history_depth:
    value: 32
    type: size_t
    description: "Number of commands in recall history (heap-backed)"
    range: "1..100"
  history_total_bytes:
    value: 65536
    type: size_t
    description: "Total bytes the heap-backed recall history may hold"
    range: "1024..262144"
  history_profile:
    value: "HISTORY.TXT"
    type: string
    description: "Default SD profile for history /save and /load"
  history_autosave:
    value: 1
    type: int
    description: "Auto-load the history profile at boot and auto-save it (debounced) as it changes"
    range: "0..1"
  completion_max_matches:
    value: 32
    type: int
    description: "Maximum matches reported by Tab completion before truncation"
    range: "4..256"
  completion_ghost:
    value: 1
    type: int
    description: "Show an inline ghost-text completion after the caret while typing"
    range: "0..1"
  editor_max_bytes:
    value: 1048576
    type: size_t
    description: "Maximum bytes of a file the edit editor loads into RAM (PSRAM-backed document and snapshots)"
    range: "1024..4194304"
  editor_max_lines:
    value: 65536
    type: size_t
    description: "Maximum lines the edit editor loads into RAM (only editor_render_rows are materialized as spans)"
    range: "16..262144"
  editor_undo_depth:
    value: 64
    type: int
    description: "Undo/redo depth (edit operations) kept by the editor; also byte-budgeted by editor_undo_max_bytes"
    range: "1..256"
  editor_undo_max_bytes:
    value: 4194304
    type: size_t
    description: "Total bytes of full-document undo/redo snapshots the editor keeps; oldest steps are evicted past this"
    range: "65536..67108864"
  editor_render_rows:
    value: 256
    type: size_t
    description: "Maximum document rows materialized as LVGL spans at once; larger files render a window around the cursor/scroll (kept small: the span group is rebuilt per edit)"
    range: "64..4096"
  editor_tab_width:
    value: 4
    type: int
    description: "Tab stop width (columns) used by the editor"
    range: "1..16"
  editor_line_height:
    value: 20
    type: int
    description: "Line height reserved per editor row, in pixels"
    range: "12..40"
  editor_syntax_batch:
    value: 1
    type: bool
    description: "True when the edit editor applies batch syntax highlighting"
  editor_find_bytes:
    value: 128
    type: size_t
    description: "Maximum length of the edit editor's search / replace string (bytes)"
    range: "16..512"
  editor_prompt_bytes:
    value: 320
    type: size_t
    description: "Capacity of the edit editor's prompt buffer (Save-As path, Go-to-Line number, Find/Replace string)"
    range: "64..1024"
  cursor_blink_ms:
    value: 500
    type: int
    description: "Shared cursor blink period for shell input block cursor and editor (0 = steady, no blink)"
    range: "0..2000"
  editor_selection_color:
    value: 0x335577
    type: int
    description: "RGB colour of the edit editor's selection background overlay"
    range: "0x000000..0xFFFFFF"
  editor_find_case_sensitive:
    value: 0
    type: bool
    description: "Default case sensitivity for the edit editor's Find (0 = case-folded)"
  editor_line_numbers:
    value: 1
    type: bool
    description: "True when the edit editor renders a line-number gutter"
  editor_line_number_width_chars:
    value: 5
    type: int
    description: "Width of the edit editor's line-number gutter in characters (digits); line numbers are right-aligned in this width followed by one space"
    range: "2..8"
  editor_current_line:
    value: 1
    type: bool
    description: "True when the edit editor highlights the cursor's current line"
  editor_current_line_color:
    value: 0x16222A
    type: int
    description: "RGB colour of the edit editor's current-line highlight background"
    range: "0x000000..0xFFFFFF"
  debug_log_depth:
    value: 5
    type: size_t
    description: "Number of entries in debug/error ring buffer"
    range: "1..32"
  debug_entry_bytes:
    value: 192
    type: size_t
    description: "Maximum bytes per debug log entry"
    range: "32..512"

# ---- Clock and SNTP ----
# Managed by: components/clock/clock.c + clock_commands.c
# The clock component owns the C-library system clock, timezone, and the SNTP
# client. `date`, `time`, `timezone`, and `sntp`/`ntpsync` surface it from the
# shell (the command bodies live in the clock component and render through the
# clock_host_ops_t table registered by the command module).
clock:
  ntp_server:
    value: "pool.ntp.org"
    type: string
    description: "NTP server hostname the SNTP client polls"
    range: "any resolvable hostname"
  timezone_bytes:
    value: 64
    type: size_t
    description: "Maximum timezone string length (POSIX TZ string)"
  valid_epoch:
    value: 1577836800
    type: int
    description: "Unix timestamp (2020-01-01 UTC) at or above which the clock is considered set; below it the header clock shows --:--"
    range: "0..4102444800"
  timezone_url:
    value: "http://ip-api.com/line/?fields=timezone,offset"
    type: string
    description: "IP-geolocation endpoint for automatic timezone detection (plain-text line format: timezone name, then UTC offset in seconds). No hardcoded zone."
  timezone_resync_secs:
    value: 21600
    type: int
    description: "Re-detect the timezone this often so DST transitions and travel stay correct"
    range: "3600..86400"
  timezone_max_attempts:
    value: 5
    type: int
    description: "Timezone probes before giving up (SNTP then runs in UTC)"
    range: "1..20"
  timer_slots:
    value: 8
    type: int
    description: "Stopwatch slots for the timer command (each holds one named run)"
    range: "1..32"
  timer_name_bytes:
    value: 16
    type: int
    description: "Maximum bytes for a timer slot name (plus the terminator)"
    range: "4..64"

