# P4MiniShell Configuration — Single Source of Truth
#
# Every tunable value in the firmware is documented here with:
#   - value: the current setting
#   - type: C type for the generated header
#   - description: what it controls
#   - range: valid range or constraint
#
# The companion C header is p4minishell_config.h.
# board_config.yaml remains the hardware-pin source of truth.
# sdkconfig remains the ESP-IDF build-configuration source of truth.
#
# Version: 0.2.0
# Last updated: 2026-04-29

config_version: "0.2.0"

# ---- Shell Identity ----
shell_identity:
  log_tag:
    value: "p4minishell"
    type: string
    description: "ESP_LOGx tag for shell-layer messages"
  board_requested:
    value: "JC1060P470C"
    type: string
    description: "User-requested board name"
  board_detected:
    value: "ESP32-P4-Function-EV-Board"
    type: string
    description: "Board name detected from BSP component"
  boot_message:
    value: "P4MiniShell v0.2 ready | JC1060P470C | type help"
    type: string
    description: "Startup banner shown in transcript"
  shell_prompt:
    value: "P4Shell> "
    type: string
    description: "Prompt string on input line and serial console"

# ---- Transcript and Command Buffers ----
buffers:
  transcript_bytes:
    value: 8192
    type: size_t
    description: "Maximum bytes in on-screen transcript buffer"
    range: "1024..65536"
  async_transcript_bytes:
    value: 2048
    type: size_t
    description: "Maximum bytes in async transcript staging buffer"
    range: "256..8192"
  command_bytes:
    value: 256
    type: size_t
    description: "Maximum bytes for a single command line"
    range: "64..1024"
  command_history_depth:
    value: 10
    type: size_t
    description: "Number of commands in recall history"
    range: "1..100"
  debug_log_depth:
    value: 5
    type: size_t
    description: "Number of entries in debug/error ring buffer"
    range: "1..32"
  debug_entry_bytes:
    value: 192
    type: size_t
    description: "Maximum bytes per debug log entry"
    range: "32..512"

# ---- UI Layout ----
ui_layout:
  keyboard_height:
    value: 240
    type: int
    description: "On-screen LVGL keyboard height in pixels"
    range: "100..600"
  header_refresh_period_ms:
    value: 5000
    type: int
    description: "Header status refresh timer period in milliseconds"
    range: "1000..30000"
  input_row_height:
    value: 52
    type: int
    description: "Input row (prompt line) height in pixels"
    range: "32..100"

# ---- Wi-Fi ----
wifi:
  ssid_bytes:
    value: 33
    type: size_t
    description: "Maximum SSID length including null terminator"
    range: "1..33"
  password_bytes:
    value: 65
    type: size_t
    description: "Maximum password length including null terminator"
    range: "1..65"
  detail_bytes:
    value: 256
    type: size_t
    description: "Maximum Wi-Fi detail/status message length"
    range: "64..1024"
  origin_bytes:
    value: 32
    type: size_t
    description: "Maximum Wi-Fi origin/backend description length"
    range: "16..128"
  default_ssid:
    value: ""
    type: string
    description: "Default SSID from sdkconfig (empty if not set)"
  default_password:
    value: ""
    type: string
    description: "Default password from sdkconfig (empty if not set)"
  runtime_enabled_guard:
    value: "CONFIG_ESP_WIFI_ENABLED || CONFIG_ESP_HOST_WIFI_ENABLED || CONFIG_ESP_HOSTED_ENABLED"
    type: macro
    description: "Compile-time guard for Wi-Fi runtime code"

# ---- Bluetooth ----
bluetooth:
  log_tag:
    value: "bluetooth"
    type: string
    description: "ESP_LOGx tag for Bluetooth messages"
  device_name:
    value: "P4MiniShell BLE"
    type: string
    description: "BLE device name used during advertising"
  discovery_limit:
    value: 16
    type: size_t
    description: "Maximum BLE scan results to report"
    range: "1..64"
  name_bytes:
    value: 32
    type: size_t
    description: "Maximum Bluetooth device name string length"
    range: "8..128"
  addr_bytes:
    value: 18
    type: size_t
    description: "Maximum Bluetooth address string length (XX:XX:XX:XX:XX:XX)"
    range: "18"
  hosted_runtime_supported:
    value: 0
    type: bool
    description: "Legacy Bluedroid compile gate (0=disabled, 1=enabled)"
  scan_limit:
    value: 8
    type: size_t
    description: "Maximum BLE scan results surfaced via shell bt/scan"
    range: "1..32"

# ---- SD Card and Filesystem ----
sd_card:
  fatfs_drive:
    value: "0:"
    type: string
    description: "FatFs drive letter prefix for SD access"
  path_bytes:
    value: 320
    type: size_t
    description: "Maximum resolved SD path length"
    range: "64..1024"
  list_limit:
    value: 128
    type: size_t
    description: "Maximum directory entries per sd ls"
    range: "16..512"
  cat_default_bytes:
    value: 1024
    type: size_t
    description: "Default preview size for sd cat"
    range: "64..8192"
  cat_max_bytes:
    value: 8192
    type: size_t
    description: "Maximum preview size for sd cat"
    range: "256..32768"
  io_buffer_bytes:
    value: 128
    type: size_t
    description: "I/O buffer size for SD file operations"
    range: "32..1024"

# ---- Batch Engine and Environment ----
batch_env:
  env_var_max:
    value: 24
    type: size_t
    description: "Maximum RAM-only environment variables"
    range: "1..128"
  env_name_bytes:
    value: 32
    type: size_t
    description: "Maximum environment variable name length"
    range: "8..128"
  env_value_bytes:
    value: 256
    type: size_t
    description: "Maximum environment variable value length"
    range: "16..1024"
  batch_line_bytes:
    value: 384
    type: size_t
    description: "Maximum single batch file line length"
    range: "64..2048"
  batch_args_max:
    value: 9
    type: size_t
    description: "Maximum batch arguments (%1 through %9)"
    range: "1..26"
  batch_depth_max:
    value: 4
    type: size_t
    description: "Maximum nested batch file call depth"
    range: "1..16"
  file_io_buffer_bytes:
    value: 512
    type: size_t
    description: "I/O buffer size for general file operations"
    range: "64..4096"

# ---- GPIO and Hardware Control ----
gpio_hardware:
  gpio_name_bytes:
    value: 32
    type: size_t
    description: "Maximum GPIO pin name string length"
    range: "8..64"
  gpio_pin_limit:
    value: 24
    type: size_t
    description: "Maximum exposed GPIO pins in board pin table"
    range: "8..64"
  c6_host_reset_gpio:
    value: 54
    type: gpio_num_t
    description: "GPIO number for ESP32-C6 hosted reset line"
  battery_atten:
    value: "ADC_ATTEN_DB_12"
    type: adc_atten_t
    description: "ADC attenuation for battery voltage reading"
  battery_min_sleep_freq_mhz:
    value: 40
    type: int
    description: "Minimum CPU frequency in MHz for light sleep entry"
    range: "10..240"

# ---- Header Bar Visuals ----
header_visuals:
  notification_bytes:
    value: 160
    type: size_t
    description: "Maximum header notification string length"
    range: "32..512"
  text_color:
    value: "0xC7FFD0"
    type: uint32_t
    description: "Header text color (light green)"
  muted_color:
    value: "0x5E7063"
    type: uint32_t
    description: "Header muted/inactive color (dim green)"
  accent_color:
    value: "0x8DFF96"
    type: uint32_t
    description: "Header accent/active color (bright green)"
  warn_color:
    value: "0xF0C36E"
    type: uint32_t
    description: "Header warning color (amber)"
  bg_color:
    value: "0x111816"
    type: uint32_t
    description: "Header background color (dark green-black)"
  panel_color:
    value: "0x050806"
    type: uint32_t
    description: "Panel/transcript background color"

# ---- USB Host ----
usb_host:
  host_lib_task_stack:
    value: 4096
    type: size_t
    description: "USB Host Library task stack size"
    range: "2048..16384"
  event_task_stack:
    value: 6144
    type: size_t
    description: "USB event processing task stack size"
    range: "2048..16384"
  driver_task_stack:
    value: 4096
    type: size_t
    description: "USB class driver task stack size"
    range: "2048..16384"
  event_queue_depth:
    value: 16
    type: size_t
    description: "USB event queue depth"
    range: "4..64"
  text_bytes:
    value: 192
    type: size_t
    description: "Maximum USB status text message length"
    range: "32..512"
  path_bytes:
    value: 320
    type: size_t
    description: "Maximum USB filesystem path length"
    range: "64..1024"
  msc_base_path:
    value: "/usb0"
    type: string
    description: "VFS mount point for USB MSC devices"
  list_limit:
    value: 128
    type: size_t
    description: "Maximum directory entries for USB ls"
    range: "16..512"
  hid_report_max_bytes:
    value: 64
    type: size_t
    description: "Maximum USB HID report size"
    range: "8..256"
  keyboard_keys:
    value: 6
    type: size_t
    description: "Simultaneous keys in USB keyboard report"
    range: "1..16"

# ---- C6 OTA ----
c6ota:
  task_stack:
    value: 8192
    type: size_t
    description: "OTA worker task stack size"
    range: "4096..32768"
  http_block_bytes:
    value: 2048
    type: size_t
    description: "HTTP download block size"
    range: "512..8192"
  transfer_chunk:
    value: 1500
    type: size_t
    description: "ESP-Hosted SDIO OTA transfer chunk size"
    range: "256..4096"
  progress_step:
    value: 5
    type: int
    description: "Progress reporting interval in percent"
    range: "1..25"
  url_bytes:
    value: 256
    type: size_t
    description: "Maximum OTA source URL length"
    range: "64..2048"
  default_source:
    value: "default"
    type: string
    description: "Keyword for default OTA source lookup"
  default_primary:
    value: "esp32c6_hosted_slave.bin"
    type: string
    description: "Primary filename for default OTA"
  default_fallback:
    value: "network_adapter.bin"
    type: string
    description: "Fallback filename for default OTA"
  expected_chip_id:
    value: "0x000D"
    type: uint16_t
    description: "Expected ESP32-C6 chip ID in app header"
  min_major:
    value: 2
    type: int
    description: "Minimum C6 firmware major for reliable OTA"
  min_minor:
    value: 9
    type: int
    description: "Minimum C6 firmware minor for reliable OTA"
  min_patch:
    value: 7
    type: int
    description: "Minimum C6 firmware patch for reliable OTA"
  sd_fatfs_drive:
    value: "0:"
    type: string
    description: "FatFs drive letter for SD OTA sources"

# ---- Task Stacks ----
task_stacks:
  wifi_init:
    value: 6144
    type: size_t
    description: "Wi-Fi initialization background task stack"
    range: "4096..16384"
  command:
    value: 8192
    type: size_t
    description: "Shell command worker task stack"
    range: "4096..32768"
  uart_console:
    value: 4096
    type: size_t
    description: "UART/serial console reader task stack"
    range: "2048..8192"

# ---- Networking ----
networking:
  log_tag:
    value: "wifi"
    type: string
    description: "ESP_LOGx tag for networking/Wi-Fi messages"
