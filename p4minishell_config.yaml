    range: "10..40"
  dir_page_lines:
    value: 20
    type: int
    description: "Rows shown between pauses by dir /p"
    range: "5..80"
  dir_recurse_depth_max:
    value: 8
    type: int
    description: "Maximum directory recursion depth for dir /s and find file discovery"
    range: "1..32"
  find_match_max:
    value: 256
    type: int
    description: >-
      Maximum matches printed by find in file-discovery mode before it stops
