dependencies:
  # Pin the managed components to the same versions the firmware uses so the
  # unit tests compile the shell and command modules against an identical
  # dependency set. Without these pins the component manager resolves newer
  # majors (for example esp_hosted 3.x) whose Kconfig is incompatible.
  lvgl/lvgl:
    version: "9.5.0"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_lvgl_port:
    version: "2.9.0"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: "^3.0.6"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_wifi_remote:
    version: "^1.6.4"
    rules:
      - if: "target in [esp32p4]"
  espressif/usb: "*"
  espressif/usb_host_msc: "*"
  espressif/usb_host_hid: "*"
  espressif/led_strip: "^3.0.0"
